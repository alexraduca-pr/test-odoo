repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # upstream declares stages [commit, push, manual]: restrict to commit
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.1.0
    hooks:
      - id: pylint
        name: Odoo Framework Check
        additional_dependencies:
          - pylint-odoo==9.1.3
        args: [
          "--rcfile=.pylintrc",
          "."
        ]
